name: BOOKPILE quality gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  deployment-script:
    name: Staging deployment script
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check shell syntax
        run: >-
          bash -n
          server/deploy/deploy-staging.sh
          server/deploy/bookpile-edge-firewall.sh
          server/deploy/install-bookpile-edge-defence.sh
          server/deploy/install-bookpile-edge-enforcement.sh
          server/deploy/fail2ban/tests/test-health-filters.sh
          server/deploy/tests/test-deploy-staging.sh
          server/deploy/tests/test-caddy-log-migration.sh
          server/scripts/migrate-caddy-access-log-rolls.sh
          server/scripts/rehearse-caddy-log-retention.sh
          server/scripts/rehearse-caddy-health-classification.sh
          server/scripts/rehearse-d6-health-policy-dry-run.sh
      - name: Exercise success and rollback paths
        run: |
          bash server/deploy/tests/test-deploy-staging.sh
          bash server/deploy/tests/test-caddy-log-migration.sh
      - name: Validate D6 Fail2ban filters
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fail2ban nftables
          bash server/deploy/fail2ban/tests/test-health-filters.sh
      - name: Validate the real D6 nftables policy in an isolated network namespace
        run: |
          sudo unshare --net bash -c '
            nft --file server/deploy/nftables/bookpile-health-enforcement.nft
            nft -j --stateless list table inet bookpile |
              tee /tmp/bookpile-nftables.json |
              python3 server/deploy/validate-bookpile-nftables.py || {
                cat /tmp/bookpile-nftables.json
                exit 1
              }
          '

  python-tests:
    name: Python tests (Local and Server)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13.7"
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            server/pyproject.toml
      - name: Install Local test dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Test Local backend
        working-directory: backend
        run: python -m pytest tests
      - name: Install Server test dependencies
        run: python -m pip install -e "server[dev]"
      - name: Test Server API
        run: python -m pytest server/tests

  frontend:
    name: Frontend tests, lint and both editions
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.15.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Test Local edition
        run: npm run test:local
      - name: Test Server edition
        run: npm run test:server
      - name: Lint
        run: npm run lint
      - name: Build both editions
        run: npm run build:all

  postgres-migrations:
    name: PostgreSQL migration rehearsal
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.6-alpine3.22
        env:
          POSTGRES_DB: bookpile_ci_test
          POSTGRES_USER: bookpile_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bookpile_ci -d bookpile_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      BOOKPILE_SERVER_DATABASE_URL: postgresql+psycopg://bookpile_ci:ci-only-password@127.0.0.1:5432/bookpile_ci_test
      BOOKPILE_SERVER_TEST_DATABASE_URL: postgresql+psycopg://bookpile_ci:ci-only-password@127.0.0.1:5432/bookpile_ci_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13.7"
          cache: pip
          cache-dependency-path: server/pyproject.toml
      - run: python -m pip install -e "server[dev]"
      - name: Rehearse migrations, constraints and concurrent writes
        working-directory: server
        run: python -m pytest tests/test_postgresql_integration.py
      - name: Upgrade the cleaned database to current schema
        working-directory: server
        run: alembic upgrade head
      - name: Verify current migration
        working-directory: server
        run: test "$(alembic current 2>/dev/null | grep -c '(head)')" -eq 1
      - name: Re-run upgrade to prove idempotence
        working-directory: server
        run: alembic upgrade head

  production-images:
    name: Build production images
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server/docker/api.Dockerfile
          push: false
          tags: bookpile-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server/docker/web.Dockerfile
          push: false
          load: true
          tags: bookpile-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Rehearse D6 health classification and private log schema
        run: >-
          BOOKPILE_CADDY_IMAGE=bookpile-web:ci
          sh server/scripts/rehearse-caddy-health-classification.sh
      - name: Rehearse independent D6 health policies in dry-run
        run: >-
          BOOKPILE_CADDY_IMAGE=bookpile-web:ci
          sh server/scripts/rehearse-d6-health-policy-dry-run.sh
      - name: Build operational backup image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server/docker/backup.Dockerfile
          push: false
          tags: bookpile-backup:ci
          cache-from: type=gha,scope=backup
          cache-to: type=gha,mode=max,scope=backup
