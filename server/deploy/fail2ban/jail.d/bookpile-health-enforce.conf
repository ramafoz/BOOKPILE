[bookpile-health-live-enforce]
enabled = false
filter = bookpile-health-live
backend = polling
logpath = /var/log/bookpile/defensive-events.log
usedns = no
findtime = 60
maxretry = 121
bantime = 600
action = bookpile-nftables-live

[bookpile-health-ready-enforce]
enabled = false
filter = bookpile-health-ready
backend = polling
logpath = /var/log/bookpile/defensive-events.log
usedns = no
findtime = 60
maxretry = 31
bantime = 600
action = bookpile-nftables-ready
