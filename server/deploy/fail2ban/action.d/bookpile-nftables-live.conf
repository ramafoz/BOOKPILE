[Definition]
actionstart_on_demand = false
actionstart = /usr/local/sbin/bookpile-edge-firewall ensure
actioncheck = /usr/local/sbin/bookpile-edge-firewall check
actionban = /usr/local/sbin/bookpile-edge-firewall ban live <ip>
            /usr/bin/logger --priority authpriv.notice --tag bookpile-d6-enforce -- 'event=temporary_ban policy=health_live'
actionunban = /usr/local/sbin/bookpile-edge-firewall unban live <ip>
              /usr/bin/logger --priority authpriv.notice --tag bookpile-d6-enforce -- 'event=temporary_ban_released policy=health_live'
actionflush = /usr/local/sbin/bookpile-edge-firewall flush live
actionstop = /usr/local/sbin/bookpile-edge-firewall flush live
