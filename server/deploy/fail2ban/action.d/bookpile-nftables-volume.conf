[Definition]
actionstart_on_demand = false
actionstart = /usr/local/sbin/bookpile-edge-firewall ensure
actioncheck = /usr/local/sbin/bookpile-edge-firewall check
actionban = /usr/local/sbin/bookpile-edge-firewall ban volume <ip> && /usr/bin/logger --priority authpriv.notice --tag bookpile-d6-enforce -- 'event=temporary_ban policy=edge_volume'
actionunban = /usr/local/sbin/bookpile-edge-firewall unban volume <ip> && /usr/bin/logger --priority authpriv.notice --tag bookpile-d6-enforce -- 'event=temporary_ban_released policy=edge_volume'
actionflush = /usr/local/sbin/bookpile-edge-firewall flush volume
actionstop = /usr/local/sbin/bookpile-edge-firewall flush volume
