[Definition]
actionstart_on_demand = false
actionstart = /usr/local/sbin/bookpile-edge-firewall ensure
actioncheck = /usr/local/sbin/bookpile-edge-firewall check
actionban = /usr/local/sbin/bookpile-edge-firewall ban scanner <ip> && /usr/bin/logger --priority authpriv.notice --tag bookpile-d6-enforce -- 'event=temporary_ban policy=scanner_high_confidence'
actionunban = /usr/local/sbin/bookpile-edge-firewall unban scanner <ip> && /usr/bin/logger --priority authpriv.notice --tag bookpile-d6-enforce -- 'event=temporary_ban_released policy=scanner_high_confidence'
actionflush = /usr/local/sbin/bookpile-edge-firewall flush scanner
actionstop = /usr/local/sbin/bookpile-edge-firewall flush scanner
