services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bookpile
      POSTGRES_USER: bookpile
      POSTGRES_PASSWORD: bookpile-dev
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookpile -d bookpile"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - bookpile-server-postgres:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro

volumes:
  bookpile-server-postgres:
