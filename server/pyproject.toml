[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bookpile-server"
version = "0.1.0.dev0"
description = "Hosted multi-user BOOKPILE server"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.20.0",
  "argon2-cffi==25.1.0",
  "boto3==1.43.96",
  "cryptography==50.0.1",
  "email-validator==2.3.0",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "psycopg[binary]==3.3.5",
  "pydantic-settings==2.15.0",
  "pillow==12.3.0",
  "pillow-heif==1.7.0",
  "python-multipart==0.0.32",
  "sentry-sdk==2.69.2",
  "sqlalchemy==2.0.54",
  "uvicorn[standard]==0.53.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
]

[project.scripts]
bookpile-private-objects = "bookpile_server.cli.private_objects:main"
bookpile-email-worker = "bookpile_server.cli.email_worker:main"
bookpile-operational-backup = "bookpile_server.cli.operational_backup:main"
bookpile-maintenance = "bookpile_server.cli.maintenance:main"
bookpile-account-invitations = "bookpile_server.cli.account_invitations:main"
bookpile-error-reporting = "bookpile_server.cli.error_reporting:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

